[workspace]
resolver = "2"
members = [
    "crates/kestrel-core",
    "crates/kestrel-llama",
    "crates/kestrel-server",
    "crates/kestrel-tools",
    "crates/kestrel-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT OR Apache-2.0"
authors = ["Kestrel Contributors"]

[workspace.dependencies]
# Internal workspace crates
kestrel-core = { path = "crates/kestrel-core", version = "0.1.0" }
kestrel-llama = { path = "crates/kestrel-llama", version = "0.1.0" }
kestrel-server = { path = "crates/kestrel-server", version = "0.1.0" }
kestrel-tools = { path = "crates/kestrel-tools", version = "0.1.0" }

# Async & Runtime
tokio = { version = "1.40", features = ["full"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# CLI
clap = { version = "4.5", features = ["derive"] }

# LLM Backend
llama_cpp = "0.3.2"

# Storage & Benchmarking
bincode = "1"
criterion = "0.5"
tempfile = "3"
